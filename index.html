<style>
:root{--y:#FFC900;--ink:#e8ecff;--mut:#8b93b8;--bg:#07070f;--card:rgba(18,18,38,.85);--line:#27274d;--or:#ff8a00;--red:#ff4d6d;--grn:#39ff88;--cy:#00e5ff;--pk:#ff2bd6}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:14px/1.45 "Exo 2",system-ui,sans-serif;background:radial-gradient(circle at 12% -10%,#2b1850 0,transparent 45%),radial-gradient(circle at 100% 0,#00323d 0,transparent 40%),var(--bg);background-attachment:fixed;min-height:100vh}
header{background:rgba(7,7,15,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:14px;padding:10px 22px}
.logo{height:24px;filter:drop-shadow(0 0 8px rgba(255,201,0,.7))}
nav{display:flex;gap:6px;padding:0 18px 10px;overflow-x:auto}
nav button{border:1px solid transparent;background:none;padding:7px 14px;border-radius:999px;font:600 13px "Exo 2";color:var(--mut);cursor:pointer;white-space:nowrap;transition:.2s}
nav button:hover{color:var(--cy);border-color:var(--cy)}
nav button.on{background:var(--y);color:#000;box-shadow:0 0 16px var(--y)}
main{max-width:1280px;margin:0 auto;padding:18px 22px 60px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}
.bar label{display:flex;flex-direction:column;font-size:11px;color:var(--mut);font-weight:600;gap:3px}
select,input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#0d0d20;color:var(--ink);min-width:90px;outline:0}
select:focus,input:focus{border-color:var(--cy);box-shadow:0 0 10px rgba(0,229,255,.45)}
input[type=number]{width:84px;min-width:0}
.btn{background:var(--y);color:#000;border:0;border-radius:10px;padding:9px 16px;font:700 13px "Exo 2";cursor:pointer;box-shadow:0 0 14px rgba(255,201,0,.5);transition:.15s}
.btn:active{transform:scale(.96)}
.btn.dk{background:transparent;color:var(--cy);border:1px solid var(--cy);box-shadow:0 0 14px rgba(0,229,255,.4)}
.chip{flex-direction:row!important;align-items:center;gap:6px!important;border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;color:var(--ink)!important;font-size:12px!important}
.chip:has(input:checked){border-color:var(--y);box-shadow:0 0 10px rgba(255,201,0,.5);color:var(--y)!important}
.chip input{min-width:0;width:auto;accent-color:#FFC900}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 8px 30px rgba(0,0,0,.45);transition:.25s}
.card:hover{border-color:rgba(255,201,0,.45);box-shadow:0 0 22px rgba(255,201,0,.12)}
.card h3{margin:0 0 10px;font:800 13px Orbitron,sans-serif;letter-spacing:.04em;color:var(--cy);text-shadow:0 0 10px rgba(0,229,255,.6)}
.k{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.v{font:800 26px Orbitron,sans-serif;margin-top:4px;color:var(--y);text-shadow:0 0 14px rgba(255,201,0,.55)}.v small{font:600 12px "Exo 2";color:var(--mut);text-shadow:none}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0d0d20}
td{padding:7px 8px;border-bottom:1px solid #1b1b38}
tr:hover td{background:rgba(0,229,255,.05)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.sc{max-height:460px;overflow:auto}
tr.or td{background:rgba(255,138,0,.12)}tr.or td:first-child{box-shadow:inset 4px 0 var(--or)}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid currentColor}
.t-or{color:var(--or)}.t-rd{color:var(--red)}.t-gy{color:var(--mut)}.t-mc{color:var(--cy)}.t-tr{color:var(--y)}
.up{color:var(--grn);font-weight:700}.dn{color:var(--red);font-weight:700}
.hint{color:var(--mut);font-size:12px}
canvas{max-height:320px}
td input{width:90px}
.kin{background:#fff3c4;color:#222;font-weight:700;text-align:center;width:72px;border-radius:10px;border:0}
.sa{cursor:pointer;color:var(--cy);font-weight:600}.sa:hover{text-shadow:0 0 10px var(--cy);text-decoration:underline}
#login{position:fixed;inset:0;background:radial-gradient(circle at 50% 0,#2b1850,#07070f 70%);display:flex;align-items:center;justify-content:center;z-index:20;flex-direction:column;gap:14px;text-align:center}
#login .logo{height:56px}#login .err{color:var(--red);min-height:18px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:25;padding:16px}
#modal.on{display:flex}#modal .card{width:min(760px,100%);max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#000;color:var(--y);border:1px solid var(--y);padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:30;box-shadow:0 0 16px rgba(255,201,0,.5)}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="login">
  <h1><img class="logo" alt="realme"></h1>
  <div class="hint">SA Productivity Dashboard · masukkan password</div>
  <input id="pw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn dk" onclick="doLogin()">Masuk</button>
  <div class="err" id="lerr"></div>
</div>
<header>
  <div class="top"><img class="logo" alt="realme"><span class="hint">SA Productivity</span></div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div id="toast"></div>
<div id="modal" onclick="if(event.target===this)this.classList.remove('on')"></div>

let AC;document.addEventListener('click',e=>{if(!e.target.closest('button,select,.sa,.chip'))return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type='square';o.frequency.setValueAtTime(950,t);o.frequency.exponentialRampToValueAtTime(380,t+.06);g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.09)}catch(_){}},true);
const CH={};
function chart(id,cfg){const c=document.getElementById(id);if(!c)return;if(CH[id])CH[id].destroy();CH[id]=new Chart(c,cfg)}

async function api(action,p={}){
  const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action,pw:PW,...p})});
  return r.json();
}
async function doLogin(){
  PW=$('#pw').value||PW;$('#lerr').textContent='Memuat...';
  try{
    const r=await api('all');
    if(!r.ok){$('#lerr').textContent=r.error==='auth'?'Password salah':'Error: '+r.error;return}
    sessionStorage.setItem('pw',PW);
    DB={data:{},kpi:{},rec:{},resign:{},tm:{}};
    for(const k in r.items){const [t,ym]=k.split('|');if(DB[t])DB[t][ym]=JSON.parse(r.items[k])}
    const m=mons();S.ym=m[m.length-1]||'';S.yr=S.ym.slice(0,4)||String(new Date().getFullYear());
    S.to=cutoff(S.ym)||31;
    $('#login').style.display='none';draw();
  }catch(e){$('#lerr').textContent='Tidak bisa terhubung ke server (cek API_URL)'}
}
async function save(t,ym,obj){
  DB[t][ym]=obj;
  const r=await api('put',{key:t+'|'+ym,value:JSON.stringify(obj)});
  if(!r.ok)toast('Gagal menyimpan: '+r.error);else toast('Tersimpan');
}

/* ---------- data helpers ---------- */
function cutoff(ym){const d=DB.data[ym];if(!d)return 0;let c=0;d.rows.forEach(r=>r.x.forEach((v,i)=>{if(v>0&&i+1>c)c=i+1}));return c}
const so=r=>sum(r.x.slice(S.from-1,S.to));
function R(ym,useArm=true){const d=DB.data[ym];if(!d)return[];return d.rows.filter(r=>(!useArm||!S.arm||r.a===S.arm)&&(!S.ch||r.ch===S.ch)&&smOk(r))}
function groupArm(rs){const g={};rs.forEach(r=>{(g[r.a]=g[r.a]||{a:r.a,ch:r.ch,rs:[]}).rs.push(r)});return Object.values(g)}
const armsOf=ym=>[...new Set((DB.data[ym]?.rows||[]).filter(smOk).map(r=>r.a))].sort();
const tenure=m=>m<=3?'0-3 bln':m<=6?'4-6 bln':m<=12?'7-12 bln':'>12 bln';
const TB=['0-3 bln','4-6 bln','7-12 bln','>12 bln'];
const chTag=c=>`<span class="tag ${c==='MC'?'t-mc':'t-tr'}">${c==='MC'?'MC':'Tradi'}</span>`;
const gr=(a,b)=>b?`<span class="${a>=b?'up':'dn'}">${a>=b?'▲':'▼'} ${Math.abs((a-b)/b*100).toFixed(1)}%</span>`:'-';

/* ---------- filter bar ---------- */
function bar(opts={}){
  const m=mons();
  let h='<div class="bar">';
  h+=`<label>Bulan<select onchange="S.ym=this.value;S.to=cutoff(S.ym)||31;S.from=1;S.yr=S.ym.slice(0,4);draw()">${m.map(x=>`<option value="${x}" ${x===S.ym?'selected':''}>${mlabel(x)}</option>`).join('')}</select></label>`;
  if(!opts.nodate)h+=`<label>Tanggal dari<input type="number" min="1" max="31" value="${S.from}" onchange="S.from=+this.value;draw()"></label><label>sampai<input type="number" min="1" max="31" value="${S.to}" onchange="S.to=+this.value;draw()"></label>`;
  if(!opts.noarm)h+=`<label>ARM<select onchange="S.arm=this.value;draw()"><option value="">Semua ARM</option>${armsOf(S.ym).map(a=>`<option ${a===S.arm?'selected':''}>${a}</option>`).join('')}</select></label>`;
  if(!opts.noch)h+=`<label>Channel<select onchange="S.ch=this.value;draw()"><option value="">Tradi + MC</option><option value="TRADI" ${S.ch==='TRADI'?'selected':''}>Tradi</option><option value="MC" ${S.ch==='MC'?'selected':''}>Modern Channel</option></select></label>`;
  return h+'</div>';
}

/* ---------- views ---------- */
const V={};
V.dash=()=>{
  const rs=R(S.ym);if(!rs.length)return['<div class="card">Belum ada data. Buka tab Upload.</div>'];
  const tot=sum(rs.map(so)),el=rs.filter(r=>r.m>=1),hi=el.filter(r=>so(r)>=21&&so(r)<=25),lo=el.filter(r=>so(r)<21);
  const kp=DB.kpi[S.ym]||{};
  const gs=groupArm(rs).map(g=>{const s=sum(g.rs.map(so)),k=kp[g.a]||{};return{...g,s,n:g.rs.length,t:k.so||0}}).sort((a,b)=>b.s-a.s);
  const perSA=r=>{const k=kp[r.a];if(!k||!k.so)return 0;return k.so/(DB.data[S.ym].rows.filter(z=>z.a===r.a).length||1)};
  const list=rs.filter(r=>!S.q||(r.n+r.a).toLowerCase().includes(S.q.toLowerCase())).sort((a,b)=>so(b)-so(a));
  const html=bar()+`<div class="grid">
  <div class="card"><div class="k">Total SO</div><div class="v">${fmt(tot)}</div></div>
  <div class="card"><div class="k">SA aktif</div><div class="v">${fmt(rs.length)}</div></div>
  <div class="card"><div class="k">Produktivitas (SO/SA)</div><div class="v">${(tot/rs.length).toFixed(2)}</div></div>
  <div class="card"><div class="k">SA 21–25 unit</div><div class="v" style="color:var(--or)">${hi.length}</div></div>
  <div class="card"><div class="k">SA &lt; 21 unit <small>(≥1 bln kerja)</small></div><div class="v">${lo.length}</div></div></div>
  <div class="two"><div class="card"><h3>SO harian</h3><canvas id="c1"></canvas></div>
  <div class="card"><h3>Per ARM</h3><div class="sc"><table><tr><th>ARM</th><th>CH</th><th class="n">SA</th><th class="n">SO</th><th class="n">Prod</th><th class="n">Target</th><th class="n">Ach</th></tr>
  ${gs.map(g=>`<tr><td>${g.a}</td><td>${chTag(g.ch)}</td><td class="n">${g.n}</td><td class="n">${fmt(g.s)}</td><td class="n">${(g.s/g.n).toFixed(1)}</td><td class="n">${g.t?fmt(g.t):'-'}</td><td class="n">${g.t?pc(g.s/g.t):'-'}</td></tr>`).join('')}</table></div></div></div>
  <div class="card"><h3>Detail SA <input placeholder="Cari nama / ARM" value="${S.q}" oninput="S.q=this.value;draw(1)" style="margin-left:10px;font-weight:400"></h3><div class="sc"><table><tr><th>Nama SA</th><th>ARM</th><th>CH</th><th>Masa kerja</th><th class="n">SO</th><th class="n">Target SO/SA</th><th class="n">Ach</th><th>Status</th></tr>
  ${list.map(r=>{const s=so(r),t=perSA(r),h=r.m>=1&&s>=21&&s<=25;return`<tr class="${h?'or':''}"><td class="sa" onclick="saPop('${r.c}')">${r.n}</td><td>${r.a}</td><td>${chTag(r.ch)}</td><td>${r.m} bln</td><td class="n">${s}</td><td class="n">${t?t.toFixed(1):'-'}</td><td class="n">${t?pc(s/t):'-'}</td><td>${r.m<1?'<span class="tag t-gy">Baru</span>':h?'<span class="tag t-or">21–25</span>':s<21?'<span class="tag t-rd">&lt;21</span>':''}</td></tr>`}).join('')}</table></div></div>`;
  return[html,()=>{const dd=[];for(let d=S.from;d<=S.to;d++)dd.push(d);
    chart('c1',{type:'bar',data:{labels:dd,datasets:[{data:dd.map(d=>sum(rs.map(r=>r.x[d-1]||0))),backgroundColor:'#FFC900',borderRadius:4}]},options:{plugins:{legend:{display:false}}}})}];
};
window.saPop=c=>{const r=DB.data[S.ym].rows.find(z=>String(z.c)===String(c));if(!r)return;const dd=r.x.map((v,i)=>i+1).filter(d=>d<=cutoff(S.ym)),best=Math.max(...r.x);

<div class="grid" style="margin-top:12px"><div class="card"><div class="k">Total SO</div><div class="v">${r.t}</div></div><div class="card"><div class="k">Hari jualan</div><div class="v">${r.x.filter(v=>v>0).length}</div></div><div class="card"><div class="k">Terbaik / hari</div><div class="v">${best}</div></div></div>
<canvas id="cm"></canvas><p class="hint">Rincian tipe/model HP per SA menunggu mapping kolom dari file Excel.</p></div>`;
$('#modal').classList.add('on');chart('cm',{type:'bar',data:{labels:dd,datasets:[{label:'SO',data:dd.map(d=>r.x[d-1]),backgroundColor:'#FFC900',borderRadius:4}]},options:{plugins:{legend:{display:false}}}})};
V.mom=()=>{
  const m=(S.mm.length?S.mm.filter(x=>mons().includes(x)):mons().slice(-S.n)).sort();if(!m.length)return['<div class="card">Belum ada data.</div>'];
  const tot=(ym,ch)=>sum(R(ym,true).filter(r=>!ch||r.ch===ch).map(so));
